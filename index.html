<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Margem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Habilita a funcionalidade manual de Modo Escuro no Tailwind
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Ocultar as setas numéricas nos inputs type="number" para visual mais limpo */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased min-h-screen p-4 sm:p-8 flex justify-center transition-colors duration-300">

    <div class="w-full max-w-5xl flex flex-col gap-8">

        <header class="border-b border-slate-200 dark:border-slate-700 pb-5 flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Calculadora de Margem</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Simulação e precificação de itens automotivos conforme alíquotas e variáveis </p>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Última atualização: 16/10/2026 </p>
            </div>
            
            <!-- Botão do Modo Escuro -->
            <button onclick="toggleTheme()" id="themeToggleBtn" class="p-2.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors" title="Alternar Modo Escuro">
                <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ícone Padrão (Lua) -->
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">

            <!-- 1. CÁLCULO PREÇO DE VENDA -->
            <section class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 flex flex-col gap-5 shadow-sm hover:shadow-md transition-shadow duration-300">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100 border-b border-slate-100 dark:border-slate-700 pb-3">
                    Cálculo Preço de Venda
                </h2>

                <div class="flex flex-col gap-1.5">
                    <label for="pvItem" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Item</label>
                    <select id="pvItem" onchange="calcularPrecoVenda()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 dark:focus:border-emerald-500 transition-colors cursor-pointer appearance-none">
                        <!-- Options populated by JS -->
                    </select>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="pvCusto" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Custo do Item (R$)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-sm">R$</span>
                        <input type="number" id="pvCusto" value="0.00" step="0.01" oninput="calcularPrecoVenda()" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-colors">
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="pvMargem" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Margem Desejada (%)</label>
                    <div class="relative">
                        <input type="number" id="pvMargem" value="0.0" step="0.01" oninput="calcularPrecoVenda()" class="w-full pl-4 pr-10 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-colors">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-sm">%</span>
                    </div>
                </div>

                <div class="mt-auto pt-4">
                    <div class="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800/50 rounded-xl p-4 flex flex-col gap-1 transition-colors duration-300">
                        <span class="text-xs font-bold text-emerald-700 dark:text-emerald-500 uppercase tracking-wider">Valor Sugerido de Venda</span>
                        <span class="text-3xl font-extrabold text-emerald-700 dark:text-emerald-400 tracking-tight" id="pvResultado">R$ 0,00</span>
                    </div>
                </div>
            </section>

            <!-- 2. CÁLCULO DE MARGEM -->
            <section class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 flex flex-col gap-5 shadow-sm hover:shadow-md transition-shadow duration-300">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100 border-b border-slate-100 dark:border-slate-700 pb-3">
                    Cálculo de Margem Efetiva
                </h2>

                <div class="flex flex-col gap-1.5">
                    <label for="cmItem" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Item</label>
                    <select id="cmItem" onchange="calcularMargem()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-colors cursor-pointer appearance-none">
                        <!-- Options populated by JS -->
                    </select>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="cmCusto" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Custo do Item (R$)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-sm">R$</span>
                        <input type="number" id="cmCusto" value="0.00" step="0.01" oninput="calcularMargem()" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-colors">
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="cmVenda" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Valor Praticado na Venda (R$)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-sm">R$</span>
                        <input type="number" id="cmVenda" value="0.00" step="0.01" oninput="calcularMargem()" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-colors">
                    </div>
                </div>

                <div class="mt-auto pt-4">
                    <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800/50 rounded-xl p-4 flex flex-col gap-1 transition-colors duration-300">
                        <span class="text-xs font-bold text-blue-700 dark:text-blue-500 uppercase tracking-wider">Margem Líquida</span>
                        <span class="text-3xl font-extrabold text-blue-700 dark:text-blue-400 tracking-tight" id="cmResultado">0,00%</span>
                    </div>
                </div>
            </section>
        </main>

        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm mt-2 transition-colors duration-300">
            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Itens cadastrados e Alíquotas base</h3>
            <div id="tagsContainer" class="flex flex-wrap gap-2.5">
                <!-- Tags populated by JS -->
            </div>
        </div>

    </div>

    <script>
        // --- GERENCIAMENTO DE TEMA (DARK MODE) ---
        function toggleTheme() {
            const htmlEl = document.documentElement;
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                atualizarIconeTema('light');
            } else {
                htmlEl.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                atualizarIconeTema('dark');
            }
        }

        function carregarTema() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            }
            atualizarIconeTema(savedTheme);
        }

        function atualizarIconeTema(tema) {
            const iconEl = document.getElementById('themeIcon');
            if (tema === 'dark') {
                // Ícone de Sol
                iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            } else {
                // Ícone de Lua
                iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            }
        }

        // --- CÓDIGO ORIGINAL DA CALCULADORA ---
        const TAXAS_DEDUCAO = {
            'Pneu LP / LL': 0.18,
            'Bucha da Bandeja': 0.255935,
            'Câmara': 0.18,
            'Cubo de Roda': 0.3291,
            'Coxim do Amortecedor': 0.25588,
            'Bateria': 0.18,
            'Roda NCM 8708.70.90': 0.18,
            'Roda NCM 8716.90.90': 0.2559,
            'Lona': 0.2560,
            'Kit Catraca': 0.435,
            'Óleo LL / LP': 0.092394,
            'Bandeja': 0.1801, 
            'Sapata Freio': 0.1801,
            'Terminal de Direção': 0.180017,
            'Filtro de Óleo': 0.17972,
            'Kit Amortecedor': 0.180046,
            'Válvula de Calibragem': 0.2570,
            'Filtro de Combustível': 0.180221,
            'Filtro de Ar Cabine': 0.255625
        };

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatarPorcentagem(valor) {
            return (valor * 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
        }

        function inicializarInterface() {
            const selectPv = document.getElementById('pvItem');
            const selectCm = document.getElementById('cmItem');
            const tagsContainer = document.getElementById('tagsContainer');

            const sortedItems = Object.keys(TAXAS_DEDUCAO).sort();

            sortedItems.forEach(item => {
                const optionPv = document.createElement('option');
                optionPv.value = item;
                optionPv.textContent = item;
                selectPv.appendChild(optionPv);

                const optionCm = document.createElement('option');
                optionCm.value = item;
                optionCm.textContent = item;
                selectCm.appendChild(optionCm);

                // Tags atualizadas com classes para o Dark Mode
                const tag = document.createElement('span');
                const deducaoPerc = formatarPorcentagem(TAXAS_DEDUCAO[item]);
                tag.className = "bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-xs font-medium px-3 py-1.5 rounded-full inline-flex items-center gap-1.5 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors cursor-default";
                tag.innerHTML = `${item} <span class="text-slate-400 dark:text-slate-400 font-normal">| ${deducaoPerc}</span>`;
                tagsContainer.appendChild(tag);
            });
        }

        function calcularPrecoVenda() {
            const item = document.getElementById('pvItem').value;
            const custo = parseFloat(document.getElementById('pvCusto').value) || 0;
            const margem = (parseFloat(document.getElementById('pvMargem').value) || 0) / 100;
            const deducao = TAXAS_DEDUCAO[item] || 0.0;

            const divisor = (1 - deducao) - margem;
            const resultadoEl = document.getElementById('pvResultado');

            if (divisor <= 0) {
                resultadoEl.textContent = 'Erro de Margem';
                resultadoEl.classList.add('text-red-600', 'dark:text-red-400');
                resultadoEl.classList.remove('text-emerald-700', 'dark:text-emerald-400');
                return;
            }

            const precoVenda = custo / divisor;
            resultadoEl.classList.remove('text-red-600', 'dark:text-red-400');
            resultadoEl.classList.add('text-emerald-700', 'dark:text-emerald-400');
            resultadoEl.textContent = formatarMoeda(precoVenda);
        }

        function calcularMargem() {
            const item = document.getElementById('cmItem').value;
            const custo = parseFloat(document.getElementById('cmCusto').value) || 0;
            const venda = parseFloat(document.getElementById('cmVenda').value) || 0;
            const deducao = TAXAS_DEDUCAO[item] || 0.0;

            const resultadoEl = document.getElementById('cmResultado');

            if (venda <= 0) {
                resultadoEl.textContent = '0,00%';
                resultadoEl.classList.remove('text-red-600', 'dark:text-red-400');
                resultadoEl.classList.add('text-blue-700', 'dark:text-blue-400');
                return;
            }

            const margem = ((venda - custo) / venda) - deducao;

            if (margem < 0) {
                resultadoEl.classList.add('text-red-600', 'dark:text-red-400');
                resultadoEl.classList.remove('text-blue-700', 'dark:text-blue-400');
            } else {
                resultadoEl.classList.remove('text-red-600', 'dark:text-red-400');
                resultadoEl.classList.add('text-blue-700', 'dark:text-blue-400');
            }

            resultadoEl.textContent = formatarPorcentagem(margem);
        }

        window.onload = function() {
            carregarTema();
            inicializarInterface();
            calcularPrecoVenda();
            calcularMargem();
        };
    </script>
</body>
</html>
